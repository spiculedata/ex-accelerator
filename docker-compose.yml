services:

  # ─── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: pgduckdb/pgduckdb:17-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-analytics}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ${DATA_DIR:-/data}/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Dapr state store + pub/sub) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Dapr placement service ───────────────────────────────────────────────────
  dapr-placement:
    image: daprio/dapr:1.14.4
    command: ["./placement", "-port", "50006", "-log-level", "warn"]
    ports:
      - "50006:50006"
    restart: unless-stopped

  # ─── SvelteKit UI ─────────────────────────────────────────────────────────────
  ui:
    image: ${REGISTRY:-local}/ex-accell-ui:${TAG:-latest}
    build:
      context: ./ex-accell-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-analytics}
      # Auth: generate SESSION_SECRET with `openssl rand -hex 32`
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (openssl rand -hex 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}  # set true when serving over HTTPS
      ADDRESS_HEADER: ${ADDRESS_HEADER:-}  # e.g. X-Forwarded-For, only behind a trusted proxy
      XFF_DEPTH: ${XFF_DEPTH:-}
      # JupyterLab runs as its own service; the app hands the browser this URL and token (admins only)
      JUPYTER_URL: ${JUPYTER_URL:-http://localhost:8888}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}  # set in .env; if empty Jupyter makes its own token and the app cannot link to it
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DAPR_HTTP_PORT: "3500"
      OLLAMA_HOST: http://ollama:11434
      IPFS_ENABLED: "true"
      IPFS_BLOCKSTORE_PATH: /data/ipfs/blocks
      IPFS_DATASTORE_PATH: /data/ipfs/datastore
      PACKAGES_DIR: /data/packages
    volumes:
      - ${DATA_DIR:-/data}/ipfs:/data/ipfs
      - ${DATA_DIR:-/data}/packages:/data/packages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Dapr sidecar for UI — shares network namespace with ui container
  ui-dapr:
    image: daprio/daprd:1.14.4
    command: [
      "./daprd",
      "--app-id", "ex-accell-ui",
      "--app-port", "3000",
      "--dapr-http-port", "3500",
      "--dapr-grpc-port", "50001",
      "--placement-host-address", "dapr-placement:50006",
      "--resources-path", "/components",
      "--log-level", "warn"
    ]
    volumes:
      - ./deploy/components:/components:ro
    network_mode: "service:ui"
    depends_on:
      - ui
      - dapr-placement
      - redis
    restart: unless-stopped

  # ─── Ollama (Local LLM) ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ${DATA_DIR:-/data}/ollama:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_KEEP_ALIVE: "10m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "10"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Jupyter Lab ──────────────────────────────────────────────────────────────
  jupyter:
    image: ${REGISTRY:-local}/jupyter:${TAG:-latest}
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8888"  # loopback only; put a TLS proxy in front to expose it
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-}  # set in .env; if empty Jupyter makes its own token and the app cannot link to it
      # Read by the Jupyter image's config (jupyter/Dockerfile); the app's origin, so use the URL you open it on
      JUPYTER_ALLOW_ORIGIN: ${JUPYTER_ALLOW_ORIGIN:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-analytics}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-analytics}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ${DATA_DIR:-/data}/notebooks:/app/notebooks
    depends_on:
      postgres:
        condition: service_healthy

  # ─── WavePulse Radio Service ──────────────────────────────────────────────────
  wavepulse:
    image: ${REGISTRY:-local}/wavepulse:${TAG:-latest}
    build:
      context: ./wavepulse
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8890:8890"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-analytics}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-analytics}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
      DEVICE: cpu
      COMPUTE_TYPE: float32
      TRANSCRIPTION_BACKEND: ${TRANSCRIPTION_BACKEND:-auto}
      SCW_SECRET_KEY: ${SCW_SECRET_KEY:-}
      SCW_GPU_INSTANCE_ID: ${SCW_GPU_INSTANCE_ID:-}
      HF_TOKEN: ${HF_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      WAVEPULSE_PORT: "8890"
    volumes:
      - ${DATA_DIR:-/data}/wavepulse:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8890/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Social Crawler (Telegram/YouTube/Bluesky) ───────────────────────────────
  crawler:
    image: ${REGISTRY:-local}/crawler:${TAG:-latest}
    build:
      context: ./crawler
      dockerfile: Dockerfile
    entrypoint: ["./socialexplorer-crawler"]
    command: ["--mode=standalone", "--platform=bluesky", "--urls=firehose", "--max-posts=5000", "--max-crawl-duration=2m", "--storage-root=/data/crawls"]
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
    volumes:
      - ${DATA_DIR:-/data}/crawls:/data/crawls
    depends_on:
      - redis
    restart: "no"

  # ─── ETL ──────────────────────────────────────────────────────────────────────
  etl:
    image: ${REGISTRY:-local}/etl:${TAG:-latest}
    build:
      context: ./etl
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-analytics}
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-analytics}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - ${DATA_DIR:-/data}/gdelt_raw:/app/data/gdelt_raw
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - etl  # only starts when: docker compose --profile etl up
    restart: "no"

  # ─── Image Processing Worker ─────────────────────────────────────────────────
  image-worker:
    image: ${REGISTRY:-local}/etl:${TAG:-latest}
    build:
      context: ./etl
      dockerfile: Dockerfile
    command: python image_worker.py
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-analytics}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

