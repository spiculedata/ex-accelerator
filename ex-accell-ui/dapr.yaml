apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: ex-accell-ui-config
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://localhost:9411/api/v2/spans"
  metrics:
    enabled: true
  api:
    allowed:
      - name: state
        version: v1
        protocol: http
      - name: pubsub
        version: v1
        protocol: http
      - name: bindings
        version: v1
        protocol: http
      - name: secrets
        version: v1
        protocol: http
  middleware:
    http:
      - name: uppercase
        type: middleware.http.uppercase