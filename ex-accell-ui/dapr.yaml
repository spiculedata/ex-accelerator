version: 1
common:
  resourcesPath: ./components
apps:
  - appID: ex-accell-ui
    appDirPath: ./
    appPort: 5173
    appProtocol: http
    daprHTTPPort: 3500
    daprGRPCPort: 50001
    appHealthCheckPath: "/api/health"
    appHealthProbeInterval: 10
    appHealthProbeTimeout: 120
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
  - appID: telegram-scraper
    appDirPath: ../crawler
    appPort: 6481
    appProtocol: grpc
    daprHTTPPort: 3502
    daprGRPCPort: 50002
    command: ["./telegram-scraper", "--mode", "dapr-job", "--dapr-port", "6481"]
