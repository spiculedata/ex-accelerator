[tool.poetry]
name = "ex-accell-ui"
version = "0.1.0"
description = "Social Explorer UI with Jupyter integration"
authors = ["Social Explorer contributors"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
jupyterlab = "^4.4.5"
ipywidgets = "^8.1.7"
pandas = "^2.3.1"
numpy = "^2.3.2"
matplotlib = "^3.10.3"
seaborn = "^0.13.2"
scikit-learn = "^1.7.1"
nltk = "^3.9.1"
textblob = ">=0.19,<0.21"
plotly = "^6.2.0"
dash = "^3.1.1"
duckdb = "^1.3.2"
openllm = "^0.6.30"
torch = "^2.7.1"
torchvision = "^0.22.1"
torchaudio = "^2.7.1"
ollama = ">=0.5.1,<0.7.0"

[tool.poetry.group.dev.dependencies]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"