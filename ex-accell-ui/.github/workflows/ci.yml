name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: ex-accell-ui/package-lock.json

    - name: Install dependencies
      working-directory: ex-accell-ui
      run: npm ci

    - name: Type check
      working-directory: ex-accell-ui
      run: npm run check

    - name: Build
      working-directory: ex-accell-ui
      run: npm run build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: |
          ex-accell-ui/build/
          ex-accell-ui/.svelte-kit/
        retention-days: 1

  unit-tests:
    name: Unit Tests (Vitest)
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: ex-accell-ui/package-lock.json

    - name: Install dependencies
      working-directory: ex-accell-ui
      run: npm ci

    - name: Run unit tests
      working-directory: ex-accell-ui
      run: npx vitest run --reporter=github --coverage

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: ex-accell-ui/coverage/
        if-no-files-found: ignore

  playwright-e2e:
    name: E2E Tests (Playwright)
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: ex-accell-ui/package-lock.json

    - name: Install dependencies
      working-directory: ex-accell-ui
      run: npm ci

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output
        path: ex-accell-ui/

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ hashFiles('ex-accell-ui/package-lock.json') }}

    - name: Install Playwright browsers
      working-directory: ex-accell-ui
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      working-directory: ex-accell-ui
      run: npx playwright test --project=chromium

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ex-accell-ui/playwright-report/
        if-no-files-found: ignore

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ex-accell-ui/test-results/
        if-no-files-found: ignore
