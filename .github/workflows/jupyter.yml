name: Jupyter

on:
  push:
    branches: [main]
    paths:
      - 'jupyter/**'
      - '.github/workflows/jupyter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'jupyter/**'
      - '.github/workflows/jupyter.yml'

permissions:
  contents: read

jobs:
  python-tests:
    name: Jupyter helpers (pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pytest
        run: python3 -m venv .venv && .venv/bin/pip install --quiet pytest

      - name: Run tests
        working-directory: jupyter
        run: ../.venv/bin/python -m pytest -q
