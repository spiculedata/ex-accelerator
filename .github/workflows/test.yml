name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: ex-accell-ui/package-lock.json

      - name: Install dependencies
        working-directory: ex-accell-ui
        run: npm ci

      - name: Type check
        working-directory: ex-accell-ui
        run: npm run check || true

      - name: Build
        working-directory: ex-accell-ui
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: |
            ex-accell-ui/build/
            ex-accell-ui/.svelte-kit/
          retention-days: 1

  unit-tests:
    name: Unit Tests (Vitest)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: ex-accell-ui/package-lock.json

      - name: Install dependencies
        working-directory: ex-accell-ui
        run: npm ci

      - name: Run unit tests
        working-directory: ex-accell-ui
        run: npx vitest run --coverage --reporter=default

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: ex-accell-ui/coverage/
          if-no-files-found: ignore

  playwright-e2e:
    name: E2E Tests (Playwright)
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgduckdb/pgduckdb:17-main
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:changeme@localhost:5432/analytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: ex-accell-ui/package-lock.json

      - name: Install dependencies
        working-directory: ex-accell-ui
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output
          path: ex-accell-ui/

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('ex-accell-ui/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: ex-accell-ui
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: ex-accell-ui
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: ex-accell-ui/playwright-report/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ex-accell-ui/test-results/
          if-no-files-found: ignore
