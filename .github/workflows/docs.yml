name: Docs

on:
  push:
    branches: [main]
    paths: ['docs-site/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs-site/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # VitePress "last updated" uses git history

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci
      - run: npm run docs:build

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    # Enable by setting the repository variable DOCS_DEPLOY=true (and Pages source = GitHub Actions).
    # Skipped by default so private repositories without Pages don't show failing runs.
    if: github.ref == 'refs/heads/main' && vars.DOCS_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
