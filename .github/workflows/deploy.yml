name: Build & Deploy

on:
  push:
    branches: [main, feature/improvenav]
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push UI image
        uses: docker/build-push-action@v5
        with:
          context: ./ex-accell-ui
          file: ./ex-accell-ui/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/ex-accell-ui:latest
            ${{ env.REGISTRY }}/ex-accell-ui:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/ex-accell-ui:latest
          cache-to: type=inline

      - name: Build & push ETL image
        uses: docker/build-push-action@v5
        with:
          context: ./etl
          file: ./etl/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/etl:latest
            ${{ env.REGISTRY }}/etl:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/etl:latest
          cache-to: type=inline

  deploy:
    name: Deploy to Scaleway
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/ex-accelerator

            # Pull latest compose file and deploy configs
            git pull origin main

            # Log in to Scaleway registry
            echo "${{ secrets.SCW_SECRET_KEY }}" | \
              docker login rg.fr-par.scw.cloud -u nologin --password-stdin

            # Pull new images and restart changed services only
            REGISTRY=rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }} \
            TAG=${{ github.sha }} \
            docker compose pull ui etl

            REGISTRY=rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }} \
            TAG=${{ github.sha }} \
            docker compose up -d --no-deps ui ui-dapr

            # Clean up old images
            docker image prune -f
