name: Build & Deploy

# Manual only for now: the app requires SESSION_SECRET and an admin bootstrap on the server, and
# GitHub's required-reviewers gate needs a public repo or a paid plan. Restore
#   push:
#     branches: [main]
# once the server is configured and the `production` environment has required reviewers.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }}

jobs:
  build:
    name: Build & push images
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & push UI image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ex-accell-ui
          file: ./ex-accell-ui/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/ex-accell-ui:latest
            ${{ env.REGISTRY }}/ex-accell-ui:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/ex-accell-ui:latest
          cache-to: type=inline

      - name: Build & push ETL image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./etl
          file: ./etl/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/etl:latest
            ${{ env.REGISTRY }}/etl:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/etl:latest
          cache-to: type=inline

  deploy:
    name: Deploy to Scaleway
    environment: production
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/ex-accelerator

            # Pull latest compose file and deploy configs from the deployed branch
            git fetch origin
            git stash --include-untracked || true
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}
            git stash pop || true

            # Log in to Scaleway registry
            echo "${{ secrets.SCW_SECRET_KEY }}" | \
              docker login rg.fr-par.scw.cloud -u nologin --password-stdin

            # Pull new images and restart changed services only
            REGISTRY=rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }} \
            TAG=${{ github.sha }} \
            docker compose pull ui etl

            REGISTRY=rg.fr-par.scw.cloud/${{ secrets.SCW_REGISTRY_NAMESPACE }} \
            TAG=${{ github.sha }} \
            docker compose up -d --no-deps ui ui-dapr

            # Clean up old images
            docker image prune -f
