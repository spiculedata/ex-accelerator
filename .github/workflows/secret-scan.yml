name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Run the gitleaks CLI image directly (no licence key needed, unlike gitleaks-action for orgs).
      - name: Scan git history
        run: |
          docker run --rm -v "$PWD":/repo ghcr.io/gitleaks/gitleaks:v8.24.2 \
            git /repo --redact --no-banner --verbose
