version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
  - package-ecosystem: npm
    directory: /ex-accell-ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
  - package-ecosystem: docker
    directory: /ex-accell-ui
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
